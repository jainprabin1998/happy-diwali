<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>शुभ दीपावली 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="इस दीपावली की खूबसूरत शुभकामनाएँ आपके लिए ❤️">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=Yatra+One&family=Mukta:wght@500;700&display=swap">
<style>
/* Layout: one full-screen stage, three scenes cross-fading in place (gift → greeting → finale); canvas FX layer behind, toran garland on top. Single dark festive look by design. */
:root{
  --midnight:#070b26; --midnight-2:#121848; --maroon:#5c0f1f; --maroon-deep:#2e0610;
  --gold:#f3c54f; --gold-deep:#c48a17; --gold-pale:#ffe9a8; --saffron:#ff8a1c;
  --ivory:#fff3da; --rose:#e2416f; --leaf:#2f8a4a;
  --f-display:"Yatra One","Tiro Devanagari Hindi","Noto Serif Devanagari",serif;
  --f-body:"Tiro Devanagari Hindi","Noto Serif Devanagari","Mangal",serif;
  --f-ui:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;margin:0}
[hidden]{display:none!important}
body{
  background:var(--midnight);color:var(--ivory);font-family:var(--f-body);
  -webkit-tap-highlight-color:transparent;
}
.sky{position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(120% 70% at 50% 110%, var(--maroon) 0%, rgba(92,15,31,.35) 35%, transparent 65%),
    radial-gradient(90% 60% at 50% 0%, var(--midnight-2) 0%, transparent 70%),
    var(--midnight);}
.illum{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity 3.5s ease;
  background:
    radial-gradient(70% 55% at 50% 52%, rgba(255,170,60,.34) 0%, rgba(255,120,30,.14) 40%, transparent 72%),
    radial-gradient(130% 80% at 50% 120%, rgba(160,30,40,.55) 0%, transparent 60%);}
body.lit .illum{opacity:1}
#fx{position:fixed;inset:0;z-index:2;width:100%;height:100%;pointer-events:none}
#toran{position:fixed;top:0;left:0;right:0;z-index:5;height:76px;pointer-events:none;
  padding-top:env(safe-area-inset-top,0px)}
#toran svg{width:100%;height:76px;display:block;overflow:visible}
.strand{transform-box:fill-box;transform-origin:50% 0;animation:sway 5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}

.stage{position:fixed;inset:0;z-index:4}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(14px,2.6vh,26px);text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(70px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));
  opacity:0;visibility:hidden;transform:scale(1.04);filter:blur(6px);
  transition:opacity 1.4s ease,transform 1.6s cubic-bezier(.2,.8,.2,1),filter 1.4s ease,visibility 0s linear 1.6s;
  overflow-y:auto;overflow-x:hidden}
.scene.on{opacity:1;visibility:visible;transform:none;filter:none;transition-delay:0s}
.scene.leaving{opacity:0;transform:scale(.94);filter:blur(8px)}

/* ---------- Diya ---------- */
.diya{position:relative;width:min(60vw,270px);aspect-ratio:200/120;margin-top:clamp(60px,12vh,120px)}
.diya > svg{width:100%;height:100%;display:block;overflow:visible}
.halo{position:absolute;left:50%;top:-40%;width:260%;aspect-ratio:1;transform:translate(-50%,-38%) scale(.3);
  border-radius:50%;opacity:.25;pointer-events:none;
  background:radial-gradient(circle, rgba(255,214,120,.55) 0%, rgba(255,140,40,.22) 28%, rgba(255,100,20,0) 60%);
  transition:transform 2.6s cubic-bezier(.2,.8,.2,1),opacity 2s ease}
.diya.lit .halo{transform:translate(-50%,-38%) scale(1);opacity:1;animation:breathe 4s ease-in-out 2.6s infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.78}}
.flame-wrap{position:absolute;left:50%;bottom:59%;width:15%;aspect-ratio:1/2.4;transform:translateX(-50%);pointer-events:none}
.ember{position:absolute;left:50%;bottom:-4%;width:40%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle,#ffb347 0%,rgba(255,120,30,.6) 40%,transparent 72%);animation:ember 1.8s ease-in-out infinite}
@keyframes ember{0%,100%{opacity:.5}50%{opacity:1}}
.flame{position:absolute;inset:0;transform-origin:50% 100%;transform:scale(0);transition:transform 1.2s cubic-bezier(.2,1.5,.4,1)}
.diya.lit .flame,.mini.lit .flame{transform:scale(1)}
.flame i{position:absolute;left:50%;bottom:0;display:block;border-radius:50% 50% 50% 50% / 64% 64% 36% 36%}
.f-glow{width:420%;height:180%;bottom:-40%!important;border-radius:50%!important;transform:translateX(-50%);
  background:radial-gradient(ellipse at 50% 60%,rgba(255,190,80,.55),rgba(255,120,30,.15) 45%,transparent 70%);animation:breathe 2.8s ease-in-out infinite}
.f-outer{width:100%;height:100%;filter:blur(1.5px);
  background:radial-gradient(ellipse 50% 60% at 50% 72%,#fff7cf 0%,#ffd84f 26%,#ff8f1f 56%,rgba(230,60,10,.85) 70%,rgba(200,40,0,0) 82%);
  animation:flick 2.1s ease-in-out infinite}
.f-core{width:48%;height:50%;bottom:5%!important;filter:blur(.8px);
  background:radial-gradient(ellipse at 50% 70%,#fff 0%,#fffbe8 45%,rgba(255,244,190,0) 78%);animation:flick 1.5s ease-in-out infinite reverse}
.f-blue{width:34%;height:16%;
  background:radial-gradient(ellipse at 50% 70%,rgba(90,150,255,.9),rgba(90,150,255,0) 72%);transform:translateX(-50%)}
@keyframes flick{
  0%,100%{transform:translateX(-50%) scale(1,1) skewX(0)}
  20%{transform:translateX(-53%) scale(.95,1.06) skewX(3deg)}
  45%{transform:translateX(-48%) scale(1.04,.96) skewX(-2deg)}
  70%{transform:translateX(-51%) scale(.97,1.08) skewX(2deg)}
  85%{transform:translateX(-49%) scale(1.02,.98) skewX(-1deg)}}
.oil-shine{opacity:0;transition:opacity 1.5s ease .4s}
.diya.lit .oil-shine,.mini.lit .oil-shine{opacity:1}

.eyebrow{font-family:var(--f-ui);font-weight:500;font-size:13px;letter-spacing:.18em;color:var(--gold);opacity:.85;
  display:flex;align-items:center;gap:10px}
.eyebrow::before,.eyebrow::after{content:"";width:34px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.eyebrow::after{transform:scaleX(-1)}
.intro-line{font-family:var(--f-body);font-style:italic;font-size:clamp(21px,5.8vw,30px);line-height:1.6;
  color:var(--gold-pale);text-wrap:balance;max-width:20ch;text-shadow:0 0 18px rgba(243,197,79,.35);
  transition:opacity 1s ease,transform 1s ease}
.intro-line span{display:inline-block;opacity:0;transform:translateY(10px);animation:rise 1.2s ease forwards}
@keyframes rise{to{opacity:1;transform:none}}
body.lit .intro-line,body.lit .intro .eyebrow{opacity:.0;transform:translateY(-8px)}

.btn{position:relative;overflow:hidden;border:0;cursor:pointer;font-family:var(--f-ui);font-weight:700;
  font-size:clamp(16px,4.4vw,19px);color:var(--maroon-deep);padding:15px 26px;border-radius:999px;
  background:linear-gradient(135deg,#fff0b8 0%,var(--gold) 35%,var(--gold-deep) 70%,#ffd36b 100%);
  box-shadow:0 0 0 1px rgba(255,230,160,.6) inset,0 8px 30px rgba(243,160,40,.35),0 0 0 0 rgba(243,197,79,.5);
  animation:pulse 2.4s ease-in-out infinite;transition:transform .2s ease,opacity .8s ease}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:sheen 3s ease-in-out infinite}
.btn:active{transform:scale(.96)}
.btn:focus-visible,.icon-btn:focus-visible,.ghost:focus-visible{outline:2px solid var(--ivory);outline-offset:3px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 1px rgba(255,230,160,.6) inset,0 8px 30px rgba(243,160,40,.35),0 0 0 0 rgba(243,197,79,.45)}
  50%{box-shadow:0 0 0 1px rgba(255,230,160,.6) inset,0 8px 34px rgba(243,160,40,.55),0 0 0 14px rgba(243,197,79,0)}}
@keyframes sheen{0%,55%{left:-60%}100%{left:130%}}
body.lit .intro .btn{opacity:0;pointer-events:none}
.intro .btn{opacity:0;animation:pulse 2.4s ease-in-out infinite, fadein 1s ease 1.6s forwards}
@keyframes fadein{to{opacity:1}}

/* ---------- Greeting ---------- */
.card{position:relative;width:min(100%,520px);padding:clamp(20px,3.4vh,34px) clamp(18px,5vw,34px);
  background:linear-gradient(180deg,rgba(92,15,31,.62),rgba(46,6,16,.72));
  border-radius:22px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  box-shadow:0 0 0 1px rgba(243,197,79,.55),0 0 0 6px rgba(46,6,16,.6),0 0 0 7px rgba(243,197,79,.35),0 20px 60px rgba(0,0,0,.5)}
.card .corner{position:absolute;width:30px;height:30px;color:var(--gold);opacity:.9}
.card .corner.tl{top:8px;left:8px}.card .corner.tr{top:8px;right:8px;transform:scaleX(-1)}
.card .corner.bl{bottom:8px;left:8px;transform:scaleY(-1)}.card .corner.br{bottom:8px;right:8px;transform:scale(-1,-1)}
.poem{font-size:clamp(15px,min(4.5vw,2.45vh),21px);line-height:1.72;color:var(--ivory);margin-top:10px}
.poem .ln{display:block;opacity:0;transform:translateY(12px);filter:blur(4px)}
.greet.on .poem .ln{animation:lnin 1.1s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d)}
@keyframes lnin{to{opacity:1;transform:none;filter:none}}
.poem .gap{display:block;height:.7em}
.poem .em{color:var(--gold-pale);font-style:italic}
.poem .key{font-family:var(--f-display);color:var(--gold);font-size:1.08em;text-shadow:0 0 14px rgba(243,197,79,.4)}
.greet .btn{opacity:0;pointer-events:none;animation:none}
.greet .btn.show{opacity:1;pointer-events:auto;animation:pulse 2.4s ease-in-out infinite}

/* ---------- Finale ---------- */
.finale{gap:clamp(10px,2vh,20px)}
.title{font-family:var(--f-display);font-size:clamp(34px,10.5vw,66px);line-height:1.25;
  background:linear-gradient(100deg,#b8740f 0%,#ffe9a8 22%,#f3c54f 38%,#fff7d6 50%,#d79a1f 64%,#ffe39a 80%,#b8740f 100%);
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(243,170,50,.45)) drop-shadow(0 2px 0 rgba(90,20,10,.8));
  opacity:0;transform:scale(.7)}
.finale.on .title{animation:titleIn 1.6s cubic-bezier(.2,1.3,.4,1) .3s forwards,shimmer 5s linear 2s infinite}
@keyframes titleIn{to{opacity:1;transform:none}}
@keyframes shimmer{to{background-position:-220% 0}}
.rangoli-box{position:relative;width:min(70vw,34vh,330px);aspect-ratio:1;flex:none}
.rangoli-box > svg{width:100%;height:100%;display:block;overflow:visible}
.ring{transform-origin:0 0;transform:scale(0) rotate(-40deg);opacity:0;transition:transform 1.6s cubic-bezier(.2,1.2,.3,1),opacity 1s ease}
.finale.on .ring{transform:none;opacity:1}
.spin{animation:spin 80s linear infinite;transform-origin:0 0}
.spin.rev{animation-duration:60s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.mini{position:absolute;width:15%;aspect-ratio:200/120;transform:translate(-50%,-50%)}
.mini svg{width:100%;height:100%;display:block;overflow:visible}
.mini .flame-wrap{bottom:56%;width:17%}
.mini .flame{transition-duration:.8s}
.sub{font-size:clamp(16px,4.4vw,21px);line-height:1.6;color:var(--ivory);max-width:30ch;text-wrap:balance}
.last{font-style:italic;font-size:clamp(14px,3.8vw,18px);line-height:1.6;color:var(--gold-pale);max-width:34ch;text-wrap:balance;opacity:.92}
.fade{opacity:0;transform:translateY(10px)}
.finale.on .fade{animation:rise 1.2s ease forwards;animation-delay:var(--d)}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.ghost{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-ui);font-weight:700;font-size:16px;
  color:var(--gold-pale);background:rgba(46,6,16,.55);border:1px solid rgba(243,197,79,.6);border-radius:999px;
  padding:12px 20px;cursor:pointer;text-decoration:none}
.ghost.wa{background:linear-gradient(135deg,#1fae5b,#128c4a);border-color:rgba(200,255,220,.5);color:#fff}
.ghost svg{width:20px;height:20px}

.icon-btn{position:fixed;z-index:8;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));
  width:44px;height:44px;border-radius:50%;border:1px solid rgba(243,197,79,.6);background:rgba(7,11,38,.6);
  color:var(--gold);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(4px)}
.icon-btn svg{width:22px;height:22px}
.flash{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 50%,rgba(255,240,200,.9),rgba(255,180,60,.35) 35%,transparent 70%)}
.flash.go{animation:flash 1.6s ease-out}
@keyframes flash{0%{opacity:0}12%{opacity:.85}100%{opacity:0}}

@media (prefers-reduced-motion: reduce){
  .strand,.f-outer,.f-core,.btn,.btn::after,.spin,.title{animation:none!important}
  .finale.on .title{opacity:1;transform:none}
}
</style>
</head>
<body>


<div class="sky"></div>
<div class="illum"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="toran" aria-hidden="true"></div>
<div class="flash" id="flash"></div>

<!-- shared diya drawing -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4522a"/><stop offset=".5" stop-color="#8a2618"/><stop offset="1" stop-color="#3e0a10"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd879"/><stop offset=".5" stop-color="#c88a1f"/><stop offset="1" stop-color="#7a4610"/>
    </linearGradient>
    <radialGradient id="oil" cx=".5" cy=".35" r=".7">
      <stop offset="0" stop-color="#6a3a0c"/><stop offset="1" stop-color="#2a1004"/>
    </radialGradient>
    <radialGradient id="shine" cx=".5" cy=".3" r=".6">
      <stop offset="0" stop-color="#fff2b0" stop-opacity=".95"/><stop offset=".5" stop-color="#ffb43c" stop-opacity=".45"/><stop offset="1" stop-color="#ff8a1c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <symbol id="diyaSym" viewBox="0 0 200 120">
    <ellipse cx="100" cy="113" rx="74" ry="6" fill="rgba(0,0,0,.45)"/>
    <path d="M12 48 Q20 106 100 110 Q180 106 188 48 Z" fill="url(#clay)"/>
    <path d="M26 66 Q36 78 46 66 Q56 78 66 66 Q76 78 86 66 Q96 78 106 66 Q116 78 126 66 Q136 78 146 66 Q156 78 166 66 Q172 74 176 66" fill="none" stroke="#f3c54f" stroke-width="2.2" stroke-linecap="round"/>
    <g fill="#ffe39a">
      <circle cx="46" cy="82" r="2.3"/><circle cx="66" cy="86" r="2.3"/><circle cx="86" cy="88" r="2.3"/><circle cx="106" cy="88" r="2.3"/>
      <circle cx="126" cy="86" r="2.3"/><circle cx="146" cy="83" r="2.3"/><circle cx="96" cy="98" r="3"/><circle cx="104" cy="98" r="3" fill="#ff8a1c"/>
    </g>
    <path d="M150 48 Q186 30 198 34 Q192 48 176 56 Z" fill="url(#rim)"/>
    <ellipse cx="100" cy="48" rx="88" ry="15" fill="url(#rim)"/>
    <ellipse cx="100" cy="48" rx="77" ry="10.5" fill="url(#oil)"/>
    <path d="M96.5 50 Q98 40 100 37 Q102 40 103.5 50 Z" fill="#2a1508"/>
  </symbol>
</svg>

<button class="icon-btn" id="mute" aria-label="संगीत बंद करें" aria-pressed="false" hidden>
  <svg id="ico-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
  <svg id="ico-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
</button>

<main class="stage">
  <!-- 1. The surprise -->
  <section class="scene intro on" id="s-intro" aria-label="दीप जलाइए">
    <div class="diya" id="bigDiya">
      <div class="halo"></div>
      <svg viewBox="0 0 200 120" aria-hidden="true"><use href="#diyaSym"/><ellipse class="oil-shine" cx="100" cy="47" rx="60" ry="8" fill="url(#shine)"/></svg>
      <div class="flame-wrap"><div class="ember"></div><div class="flame"><i class="f-glow"></i><i class="f-outer"></i><i class="f-core"></i><i class="f-blue"></i></div></div>
    </div>
    <p class="eyebrow">दीपोत्सव · २०२७</p>
    <p class="intro-line" id="introLine">एक दीप खुशियों का, एक दीप अपनों के नाम…</p>
    <button class="btn" id="lightBtn">✨ दीप जलाइए और शुभकामनाएँ देखिए ✨</button>
  </section>

  <!-- 2. Greeting -->
  <section class="scene greet" id="s-greet" aria-label="दीपावली शुभकामना">
    <article class="card">
      <svg class="corner tl" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 28V8a6 6 0 0 1 6-6h20"/><path d="M6 24V11a5 5 0 0 1 5-5h13"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
      <svg class="corner tr" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 28V8a6 6 0 0 1 6-6h20"/><path d="M6 24V11a5 5 0 0 1 5-5h13"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
      <svg class="corner bl" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 28V8a6 6 0 0 1 6-6h20"/><path d="M6 24V11a5 5 0 0 1 5-5h13"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
      <svg class="corner br" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 28V8a6 6 0 0 1 6-6h20"/><path d="M6 24V11a5 5 0 0 1 5-5h13"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
      <p class="eyebrow" style="justify-content:center">॥ कार्तिक अमावस्या ॥</p>
      <div class="poem" id="poem"></div>
    </article>
    <button class="btn" id="nextBtn">🪔 अंतिम उपहार खोलिए</button>
  </section>

  <!-- 3. Grand finale -->
  <section class="scene finale" id="s-finale" aria-label="शुभ दीपावली">
    <h1 class="title">॥ शुभ दीपावली 2027 ॥</h1>
    <div class="rangoli-box" id="rangoli"></div>
    <p class="sub fade" style="--d:2.6s">आपको एवं आपके पूरे परिवार को दीपावली की हार्दिक शुभकामनाएँ।</p>
    <p class="last fade" style="--d:3.4s">रोशनी बाँटिए, खुशियाँ बढ़ाइए, और अपनों के साथ हर पल को त्योहार बनाइए।</p>
  </section>
</main>

<script>
(()=>{
const SHARE_URL = "https://claude.ai/artifact/U76UZf8788gbAapg2jhxi1";
const SHARE_MSG = "इस दीपावली की खूबसूरत शुभकामनाएँ आपके लिए ❤️";
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const rand = (a,b)=>a+Math.random()*(b-a);
const pick = a => a[(Math.random()*a.length)|0];

/* ---------------- Intro text: word-by-word ---------------- */
const il = $('introLine');
il.innerHTML = il.textContent.split(' ').map((w,i)=>`<span style="animation-delay:${0.25+i*0.14}s">${w}</span>`).join(' ');

/* ---------------- Poem ---------------- */
const POEM = [
 ["इस दीपावली, आपके जीवन में सिर्फ़ दीपक ही नहीं,"],
 ["बल्कि उम्मीदों के हज़ारों सितारे रोशन हों।"],
 ["हर सुबह नई मुस्कान लेकर आए,"],
 ["हर शाम अपनों के साथ सुकून दे,"],
 ["और हर सपना हक़ीक़त की रोशनी बन जाए।"],
 null,

let pi=0; const STEP=0.62, START=0.9;
$('poem').innerHTML = POEM.map(l=>{
  if(!l) return '<span class="gap"></span>';
  const d=(START+(pi++)*STEP).toFixed(2);
  return `<span class="ln ${l[1]||''}" style="--d:${d}s">${l[0]}</span>`;
}).join('');
const POEM_TIME = (START+pi*STEP+1.2)*1000;

/* ---------------- Toran (marigold garland) ---------------- */
function buildToran(){
  const w = innerWidth, n = Math.max(7, Math.round(w/44)), gap = w/n;
  let s = `<svg viewBox="0 0 ${w} 76" preserveAspectRatio="none">`;
  s += `<path d="M0 6 ${Array.from({length:n},(_,i)=>`Q${(i+.5)*gap} 22 ${(i+1)*gap} 6`).join(' ')}" fill="none" stroke="#c48a17" stroke-width="2"/>`;
  for(let i=0;i<n;i++){
    const x=(i+.5)*gap, len = i%2? 5:7, dl=(i*0.37)%5;
    s += `<g class="strand" style="animation-delay:-${dl}s">`;
    for(let k=0;k<len;k++){
      const y=16+k*7.2, c = k%3===2? '#ffd12e' : (k%2? '#ff8a1c':'#ff6a00');
      s += `<circle cx="${x}" cy="${y}" r="4.3" fill="${c}"/><circle cx="${x-1.2}" cy="${y-1.2}" r="1.3" fill="#ffe7a0" opacity=".7"/>`;
    }
    s += `<circle cx="${x}" cy="${16+len*7.2}" r="2.6" fill="#f3c54f"/></g>`;
    if(i<n-1){
      const lx=(i+1)*gap;
      s += `<path d="M${lx} 8 q-6 10 0 22 q6 -12 0 -22z" fill="#2f8a4a"/><path d="M${lx} 9 v19" stroke="#1b5a2f" stroke-width=".8"/>`;
    }
  }
  $('toran').innerHTML = s + '</svg>';
}

/* ---------------- Canvas FX ---------------- */
const cv=$('fx'), cx=cv.getContext('2d');
let W=0,H=0,DPR=1, stars=[], dust=[], flies=[], rockets=[], sparks=[], petals=[];
let petalRate=0, fwAuto=0, fwTimer=0;
const sprites={};
function sprite(col){
  if(sprites[col]) return sprites[col];
  const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d');
  const r=g.createRadialGradient(32,32,0,32,32,32);
  r.addColorStop(0,'rgba(255,255,255,1)'); r.addColorStop(.18,col); r.addColorStop(.5,col.replace(/[\d.]+\)$/,'0.25)')); r.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=r; g.fillRect(0,0,64,64); return sprites[col]=c;
}
function resize(){
  DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0);
  const ns = Math.round(W*H/5200);
  stars = Array.from({length:ns},()=>({x:Math.random()*W,y:Math.random()*H*.85,r:Math.random()*1.3+.2,a:Math.random()*.8+.2,sp:rand(.0006,.003),ph:Math.random()*6}));
  if(!dust.length) dust = Array.from({length:46},()=>newDust(true));
  if(!flies.length) flies = Array.from({length:14},()=>({x:Math.random()*W,y:rand(H*.35,H),a:Math.random()*6,s:rand(.2,.5),ph:Math.random()*6}));
  buildToran();
}
function newDust(any){return {x:Math.random()*W,y:any?Math.random()*H:H+10,vy:rand(.15,.55),vx:rand(-.15,.15),r:rand(.6,2.2),a:rand(.3,.9),ph:Math.random()*6}}

const FW_COLS=['rgba(255,214,90,1)','rgba(255,150,40,1)','rgba(255,90,120,1)','rgba(255,240,200,1)','rgba(180,120,255,1)','rgba(120,220,255,1)','rgba(255,120,60,1)'];
function launch(x,ty){
  x = x ?? rand(W*.12,W*.88); ty = ty ?? rand(H*.12,H*.42);
  const vy = -Math.sqrt(2*0.06*(H-ty))*rand(.95,1.05);
  rockets.push({x,y:H+5,vx:rand(-.4,.4),vy,ty,col:pick(FW_COLS)});
}
function burst(x,y,col){
  const type = pick(['sphere','sphere','ring','willow','double']);
  const n = reduce? 30 : (type==='ring'?54:84);
  const cols = type==='double'? [col,pick(FW_COLS)] : [col];
  for(let i=0;i<n;i++){
    const a = Math.PI*2*i/n + rand(-.05,.05);
    let sp = type==='ring'? 3.6 : rand(.6,4.4);
    if(type==='willow') sp=rand(.8,3.2);
    sparks.push({x,y,px:x,py:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:1,decay: type==='willow'? rand(.006,.009) : rand(.011,.018),
      col: type==='willow'? 'rgba(255,200,90,1)' : cols[i%cols.length],
      g: type==='willow'? .03 : .045, size:rand(5,9), tw:Math.random()<.3});
  }
  sparks.push({x,y,px:x,py:y,vx:0,vy:0,life:1,decay:.06,col:'rgba(255,250,230,1)',g:0,size:60,flash:1});
  Audio_.boom(x/W);
}
function addPetal(){
  const rose=Math.random()<.32;
  petals.push({x:rand(-20,W+20),y:-20,vy:rand(.6,1.4),sw:rand(.6,1.6),ph:Math.random()*6,rot:Math.random()*6,vr:rand(-.03,.03),
    fl:Math.random()*6,vf:rand(.03,.08),s:rand(5,9),c: rose? pick(['#c4123f','#e2416f','#a10d2e']) : pick(['#ff8a1c','#ffb000','#ff6a00','#ffd12e'])});
}

let last=performance.now();
function frame(t){
  const dt=Math.min(3,(t-last)/16.67); last=t;
  cx.clearRect(0,0,W,H);
  // stars
  cx.globalCompositeOperation='source-over';
  for(const s of stars){
    const a=s.a*(.45+.55*Math.sin(t*s.sp+s.ph));
    cx.fillStyle=`rgba(255,240,210,${a.toFixed(3)})`; cx.fillRect(s.x,s.y,s.r,s.r);
  }
  cx.globalCompositeOperation='lighter';
  // golden dust
  const gs=sprite('rgba(255,200,90,1)');
  for(const d of dust){
    d.y-=d.vy*dt; d.x+=d.vx*dt+Math.sin(t*.001+d.ph)*.15;
    if(d.y<-10){Object.assign(d,newDust(false))}
    const a=d.a*(.5+.5*Math.sin(t*.002+d.ph)); const r=d.r*5;
    cx.globalAlpha=a; cx.drawImage(gs,d.x-r,d.y-r,r*2,r*2);
  }
  // fireflies
  const fs=sprite('rgba(220,255,140,1)');
  for(const f of flies){
    f.a+=rand(-.08,.08)*dt; f.x+=Math.cos(f.a)*f.s*dt; f.y+=Math.sin(f.a)*f.s*dt;
    if(f.x<0||f.x>W) f.a=Math.PI-f.a; if(f.y<H*.3||f.y>H) f.a=-f.a;
    const a=Math.max(0,Math.sin(t*.0015+f.ph)); cx.globalAlpha=a*.85; cx.drawImage(fs,f.x-9,f.y-9,18,18);
  }
  // rockets
  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i]; r.x+=r.vx*dt; r.y+=r.vy*dt; r.vy+=.06*dt;
    const sp=sprite(r.col); cx.globalAlpha=1; cx.drawImage(sp,r.x-6,r.y-6,12,12);
    cx.globalAlpha=.5; cx.drawImage(sprite('rgba(255,180,80,1)'),r.x-4+rand(-1,1),r.y+6,8,8);
    if(r.vy>=-.4||r.y<=r.ty){burst(r.x,r.y,r.col); rockets.splice(i,1)}
  }
  // sparks
  cx.lineCap='round';
  for(let i=sparks.length-1;i>=0;i--){
    const p=sparks[i]; p.px=p.x; p.py=p.y;
    p.vx*=Math.pow(.975,dt); p.vy=p.vy*Math.pow(.975,dt)+p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=p.decay*dt;
    if(p.life<=0){sparks.splice(i,1);continue}
    let a=p.life; if(p.tw) a*= (Math.random()<.5?.25:1);
    if(p.flash){cx.globalAlpha=p.life*.8; const s=p.size*(1.4-p.life); cx.drawImage(sprite(p.col),p.x-s,p.y-s,s*2,s*2); continue}
    cx.globalAlpha=a*.55; cx.strokeStyle=p.col; cx.lineWidth=1.6;
    cx.beginPath(); cx.moveTo(p.px-p.vx*2,p.py-p.vy*2); cx.lineTo(p.x,p.y); cx.stroke();
    cx.globalAlpha=a; const s=p.size*(.5+.5*p.life); cx.drawImage(sprite(p.col),p.x-s/2,p.y-s/2,s,s);
  }
  // petals
  cx.globalCompositeOperation='source-over';
  if(petalRate>0 && Math.random()<petalRate*dt && petals.length<(reduce?20:80)) addPetal();
  for(let i=petals.length-1;i>=0;i--){
    const p=petals[i]; p.y+=p.vy*dt; p.ph+=.02*dt; p.x+=Math.sin(p.ph)*p.sw*.6*dt; p.rot+=p.vr*dt; p.fl+=p.vf*dt;
    if(p.y>H+20){petals.splice(i,1);continue}
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.scale(Math.cos(p.fl),1);
    cx.globalAlpha=.92; cx.fillStyle=p.c; cx.beginPath(); cx.ellipse(0,0,p.s*.55,p.s,0,0,Math.PI*2); cx.fill();
    cx.globalAlpha=.35; cx.fillStyle='#fff3c0'; cx.beginPath(); cx.ellipse(-p.s*.12,-p.s*.3,p.s*.15,p.s*.4,0,0,Math.PI*2); cx.fill();
    cx.restore();
  }
  cx.globalAlpha=1;
  // auto fireworks
  if(fwAuto>0){fwTimer-=dt*16.67; if(fwTimer<=0){launch(); fwTimer=fwAuto*rand(.6,1.4)}}
  requestAnimationFrame(frame);
}

/* ---------------- Music (synthesised: tanpura + bansuri in Raag Yaman) ---------------- */
const Audio_ = (()=>{
  let ac,master,bus,nextDrone=0,di=0,nextMel=0,mi=7,phraseLeft=0,muted=false,lastBoom=0,timer;
  const SA=146.83, LVL=.5;
  const YAMAN=[1,9/8,5/4,45/32,3/2,27/16,15/8];
  const freq=i=>SA*2*YAMAN[((i%7)+7)%7]*Math.pow(2,Math.floor(i/7));
  function impulse(dur,decay){const len=ac.sampleRate*dur,b=ac.createBuffer(2,len,ac.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay)}return b}
  function noise(dur){const len=ac.sampleRate*dur,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;const s=ac.createBufferSource();s.buffer=b;return s}
  // Bhupali pentatonic: Sa Re Ga Pa Dha
  const BHUP=[1,9/8,5/4,3/2,5/3];
  const pf=i=>SA*2*BHUP[((i%5)+5)%5]*Math.pow(2,Math.floor(i/5));
  const BEAT=.52;
  // [note index (null = rest), beats]
  const TUNE=[
    [2,1],[1,.5],[0,.5],[1,1],[2,1],[3,1],[2,1],[null,2],
    [3,1],[4,.5],[5,.5],[4,1],[3,1],[2,1],[1,.5],[2,.5],[null,2],
    [5,1],[6,.5],[5,.5],[4,1],[5,1],[7,1],[6,1],[5,2],
    [4,1],[3,1],[2,.5],[1,.5],[0,1],[1,1],[0,3],[null,1]
  ];
  let nextNote=0,ti=0,nextBeat=0,bi=0;
  function sitar(f,t,v=1){
    const g=ac.createGain(),bp=ac.createBiquadFilter();bp.type='lowpass';bp.Q.value=6;
    bp.frequency.setValueAtTime(3200,t);bp.frequency.exponentialRampToValueAtTime(700,t+1.6);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.032*v,t+.005);g.gain.exponentialRampToValueAtTime(.0004,t+2.6);
    [1,1.0025].forEach(m=>{const o=ac.createOscillator();o.type='sawtooth';
      o.frequency.setValueAtTime(f*m*1.012,t);o.frequency.exponentialRampToValueAtTime(f*m,t+.06);
      o.connect(bp);o.start(t);o.stop(t+2.7)});
    bp.connect(g);g.connect(bus);
    // sympathetic shimmer
    const o=ac.createOscillator(),g2=ac.createGain();o.frequency.value=f*2;
    g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(.008*v,t+.01);g2.gain.exponentialRampToValueAtTime(.0003,t+2);
    o.connect(g2);g2.connect(bus);o.start(t);o.stop(t+2.1);
  }
  function drum(t,low){
    const o=ac.createOscillator(),g=ac.createGain();
    if(low){o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(62,t+.35);
      g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.001,t+.5)}
    else{o.frequency.setValueAtTime(560,t);g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.001,t+.22)}
    o.connect(g);g.connect(bus);o.start(t);o.stop(t+.55);
  }
  function harmonium(){
    const t=ac.currentTime,g=ac.createGain(),lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=650;lp.Q.value=.5;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.022,t+5);
    const tr=ac.createOscillator(),tg=ac.createGain();tr.frequency.value=.18;tg.gain.value=.007;tr.connect(tg);tg.connect(g.gain);tr.start();
    [SA/2,SA,SA*1.5].forEach(f=>[1,1.004].forEach(m=>{const o=ac.createOscillator();o.type='square';o.frequency.value=f*m;o.connect(lp);o.start(t)}));
    lp.connect(g);g.connect(bus);
  }
  function bell(t,f){
    [[1,.04],[2.76,.018],[5.4,.009],[8.9,.005]].forEach(([m,a],k)=>{
      const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f*m;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(a,t+.005);g.gain.exponentialRampToValueAtTime(.0005,t+3/(k+1));
      o.connect(g);g.connect(bus);o.start(t);o.stop(t+3.1)});
  }
  // Keherwa (8 beats): dha ge na ti | na ka dhi na
  const THEKA=[1,1,0,0,0,0,1,0];
  function schedule(){
    if(!ac) return; const now=ac.currentTime;
    while(nextBeat<now+.5){
      const b=bi%8; drum(nextBeat,THEKA[b]); if(b===0||b===6) drum(nextBeat+.005,false);
      if(bi%32===0) bell(nextBeat,SA*4);
      nextBeat+=BEAT/2*2; bi++;
    }
    while(nextNote<now+.5){
      const [n,d]=TUNE[ti%TUNE.length];
      if(n!==null){ sitar(pf(n),nextNote); if(d>=2) sitar(pf(n),nextNote+BEAT,.5) }
      nextNote+=d*BEAT; ti++;
    }
  }
  function start(){
    if(ac){ if(ac.state==='suspended') ac.resume(); return }
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    ac=new AC(); master=ac.createGain(); master.gain.value=0; bus=ac.createGain();
    const conv=ac.createConvolver();conv.buffer=impulse(3.4,2.4);const wet=ac.createGain();wet.gain.value=.6;
    bus.connect(master);bus.connect(conv);conv.connect(wet);wet.connect(master);master.connect(ac.destination);
    master.gain.linearRampToValueAtTime(muted?0:LVL,ac.currentTime+3);
    harmonium();nextBeat=ac.currentTime+1.2;nextNote=ac.currentTime+1.2+BEAT*8;
    timer=setInterval(schedule,120);
    document.addEventListener('visibilitychange',()=>{document.hidden?ac.suspend():ac.resume()});
  }
  function ignite(){
    if(!ac) return; const t=ac.currentTime, n=noise(1.2), bp=ac.createBiquadFilter(), g=ac.createGain();
    bp.type='bandpass';bp.Q.value=1.2;bp.frequency.setValueAtTime(300,t);bp.frequency.exponentialRampToValueAtTime(2600,t+.9);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.15);g.gain.exponentialRampToValueAtTime(.001,t+1.2);
    n.connect(bp);bp.connect(g);g.connect(bus);n.start(t);
    bell(t+.25,SA*4);bell(t+.9,SA*6);
  }
  function boom(pan){
    if(!ac||muted) return; const t=ac.currentTime; if(t-lastBoom<.18) return; lastBoom=t;
    const n=noise(.9),lp=ac.createBiquadFilter(),g=ac.createGain();lp.type='lowpass';lp.frequency.value=rand(220,420);
    g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.9);
    n.connect(lp);lp.connect(g);
    if(ac.createStereoPanner){const p=ac.createStereoPanner();p.pan.value=(pan-.5)*1.2;g.connect(p);p.connect(bus)}else g.connect(bus);
    n.start(t);
    if(Math.random()<.15) bell(t+.05,SA*pick([4,5,6]));
  }
  function setMuted(m){muted=m; if(ac) master.gain.setTargetAtTime(m?0:LVL,ac.currentTime,.25)}
  function chime(){ if(ac) bell(ac.currentTime,SA*4) }
  return {start,ignite,boom,setMuted,chime,get muted(){return muted}};
})();

/* ---------------- Rangoli ---------------- */
function buildRangoli(){
  const petal=(r0,r1,w)=>`M0 ${-r1} C${w} ${-(r1+r0)/2-((r1-r0)*.15)} ${w*.9} ${-r0-(r1-r0)*.15} 0 ${-r0} C${-w*.9} ${-r0-(r1-r0)*.15} ${-w} ${-(r1+r0)/2-((r1-r0)*.15)} 0 ${-r1}Z`;
  const ring=(n,path,fill,stroke,off=0)=>Array.from({length:n},(_,i)=>`<path d="${path}" transform="rotate(${off+i*360/n})" fill="${fill}" stroke="${stroke}" stroke-width="1"/>`).join('');
  const dots=(n,r,rad,fill)=>Array.from({length:n},(_,i)=>{const a=i/n*Math.PI*2;return `<circle cx="${(Math.cos(a)*r).toFixed(2)}" cy="${(Math.sin(a)*r).toFixed(2)}" r="${rad}" fill="${fill}"/>`}).join('');
  const L=(i,inner,cls='')=>`<g class="ring" style="transition-delay:${.6+i*.28}s"><g class="${cls}">${inner}</g></g>`;
  let s=`<svg viewBox="-104 -104 208 208" aria-hidden="true"><defs>
    <radialGradient id="rgGlow"><stop offset="0" stop-color="#ffb43c" stop-opacity=".45"/><stop offset="1" stop-color="#ff8a1c" stop-opacity="0"/></radialGradient></defs>
    <circle r="104" fill="url(#rgGlow)"/>`;
  s+=L(0, dots(40,98,2.1,'#fff3da') + `<circle r="92" fill="none" stroke="#f3c54f" stroke-width="1" stroke-dasharray="2 4"/>`, 'spin');
  s+=L(1, ring(16,petal(58,90,13),'#ff8a1c','#ffe39a') + ring(16,petal(64,82,6),'#ffd12e','none'), 'spin');
  s+=L(2, ring(12,petal(36,62,13),'#c4123f','#ffd0dc',15) + ring(12,petal(42,56,5.5),'#ff7aa0','none',15), 'spin rev');
  s+=L(3, `<circle r="38" fill="#2a0a3e" stroke="#f3c54f" stroke-width="1.5"/>` + ring(8,petal(14,36,9),'#18a39a','#aef3ea',22.5) + dots(16,30,1.6,'#ffe39a'), 'spin');
  s+=L(4, `<circle r="15" fill="#f3c54f"/><circle r="10" fill="#5c0f1f"/>` + ring(8,petal(3,10,3),'#ffd12e','none') + `<circle r="3" fill="#fff3da"/>`);
  s+='</svg>';
  let m='';
  for(let i=0;i<8;i++){
    const a=-Math.PI/2+i*Math.PI/4, x=50+Math.cos(a)*56, y=52+Math.sin(a)*56;
    m+=`<div class="mini" style="left:${x}%;top:${y}%"><svg viewBox="0 0 200 120"><use href="#diyaSym"/><ellipse class="oil-shine" cx="100" cy="47" rx="60" ry="8" fill="url(#shine)"/></svg>
      <div class="flame-wrap"><div class="flame"><i class="f-glow"></i><i class="f-outer"></i><i class="f-core"></i><i class="f-blue"></i></div></div></div>`;
  }
  $('rangoli').innerHTML=s+m;
}

/* ---------------- Flow ---------------- */
const scenes={intro:$('s-intro'),greet:$('s-greet'),finale:$('s-finale')};
const timers=[]; const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
function show(name){
  Object.entries(scenes).forEach(([k,el])=>{
    if(k===name){el.classList.remove('leaving');el.classList.add('on')}
    else if(el.classList.contains('on')){el.classList.add('leaving');el.classList.remove('on');setTimeout(()=>el.classList.remove('leaving'),1600)}
  });
}
let busy=false;
function light(){
  if(busy) return; busy=true;
  Audio_.start(); $('mute').hidden=false;
  $('bigDiya').classList.add('lit'); Audio_.ignite();
  later(()=>document.body.classList.add('lit'),250);
  later(()=>{$('flash').classList.remove('go');void $('flash').offsetWidth;$('flash').classList.add('go')},700);
  // opening barrage
  const shots = reduce? 4 : 12;
  for(let i=0;i<shots;i++) later(()=>launch(W*(.12+.76*((i*0.618)%1)), rand(H*.1,H*.38)), 800+i*(reduce?500:260));
  later(()=>{petalRate=reduce?.05:.22},1100);
  later(()=>{fwAuto=reduce?0:2600; fwTimer=1500},4400);
  later(()=>{show('greet');petalRate=reduce?.02:.07},3600);
  later(()=>$('nextBtn').classList.add('show'),3600+POEM_TIME);
}
function finale(){
  $('nextBtn').classList.remove('show'); Audio_.chime();
  show('finale');
  petalRate=reduce?.06:.3; later(()=>{petalRate=reduce?.02:.09},5000);
  const shots=reduce?3:9;
  for(let i=0;i<shots;i++) later(()=>launch(rand(W*.1,W*.9),rand(H*.06,H*.3)),400+i*330);
  document.querySelectorAll('#rangoli .mini').forEach((m,i)=>later(()=>{m.classList.add('lit');if(i%2===0)Audio_.chime()},2000+i*220));
  fwAuto=reduce?0:1900;
}
function replay(){
  timers.splice(0).forEach(clearTimeout);
  fwAuto=0; petalRate=0; rockets.length=0;
  document.body.classList.remove('lit'); $('bigDiya').classList.remove('lit');
  $('nextBtn').classList.remove('show');
  document.querySelectorAll('#rangoli .mini').forEach(m=>m.classList.remove('lit'));
  // restart CSS line animations
  ['s-greet','s-finale'].forEach(id=>{const el=$(id);el.querySelectorAll('.ln,.fade,.title,.ring').forEach(n=>{n.style.animation='none';void n.offsetWidth;n.style.animation=''})});
  show('intro');
  setTimeout(()=>{busy=false},800);
}

$('lightBtn').addEventListener('click',light);
$('nextBtn').addEventListener('click',finale);
$('mute').addEventListener('click',()=>{
  const m=!Audio_.muted; Audio_.setMuted(m);
  $('mute').setAttribute('aria-pressed',m); $('mute').setAttribute('aria-label',m?'संगीत चालू करें':'संगीत बंद करें');
  $('ico-on').style.display=m?'none':''; $('ico-off').style.display=m?'':'none';
});
// tap on the dark sky fires a rocket where you tap (after lighting)
document.addEventListener('pointerdown',e=>{
  if(!document.body.classList.contains('lit')) return;
  if(e.target.closest('button,a,.card')) return;
  launch(e.clientX, Math.max(H*.08, e.clientY));
});

buildRangoli();
addEventListener('resize',resize); resize();
requestAnimationFrame(frame);
})();
</script>
